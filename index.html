<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disneyland Wayfinding Documentation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft moving liquid silver background */
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f1f5f9);
            background-size: 400% 400%;
            animation: liquidFlow 18s ease infinite;
            background-attachment: fixed;
            padding: 40px 24px;
        }

        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Expanded high-gloss glass card container optimized for vertical reading layout */
        .light-glass-card {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 28px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.6);
            border-left: 1.5px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 1300px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px -12px rgba(100, 116, 139, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        h1 {
            color: #334155;
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .pdf-stack {
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
            width: 100%;
        }

        .pdf-box {
            width: 100%;
            text-align: left;
        }

        /* Header wrapper styled to look like an integrated status bar */
        .pdf-header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(148, 163, 184, 0.05);
        }

        .pdf-title {
            color: #334155;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* Dynamic reading counter badges */
        .pdf-counter-badge {
            background: #007aff;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 980px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
            transition: all 0.2s ease;
        }

        /* Scrollable tracking frame container */
        .viewer-container {
            width: 100%;
            height: 750px;
            overflow-y: scroll;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            background-color: #ffffff;
            position: relative;
        }

        /* Custom tracking scrollbar elements */
        .viewer-container::-webkit-scrollbar {
            width: 10px;
        }
        .viewer-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 16px;
        }
        .viewer-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 16px;
            border: 2px solid #f1f5f9;
        }

        /* Massive, edge-to-edge structural iframe viewports with strict restriction parameters */
        iframe {
            width: 100%;
            height: 100%; /* Spans full internal scroll window */
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="light-glass-card">
        <h1>Disneyland Underground Parking Lot Wayfinding</h1>

        <div class="pdf-stack">
            <!-- TOP PANEL: Final Presentation (14 Pages) -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">Final Presentation</div>
                    <div id="counter-pres" class="pdf-counter-badge">PAGE 1 / 14</div>
                </div>
                <div class="viewer-container" id="scroll-pres">
                    <!-- toolbar=0 safely locks out download menus -->
                    <iframe src="DariaEsteeTracie_FinalPresentation.pdf#toolbar=0" loading="eager" oncontextmenu="return false;"></iframe>
                </div>
            </div>

            <!-- BOTTOM PANEL: DISNEY Message Schedule (2 Pages) -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">DISNEY Message Schedule</div>
                    <div id="counter-sched" class="pdf-counter-badge">PAGE 1 / 2</div>
                </div>
                <div class="viewer-container" id="scroll-sched">
                    <iframe src="DISNEY_Message%20Schedule.pdf#toolbar=0" loading="lazy" oncontextmenu="return false;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Position Calculator Script -->
    <script>
        function setupTracker(containerId, badgeId, totalPages) {
            const container = document.getElementById(containerId);
            const badge = document.getElementById(badgeId);

            container.addEventListener('scroll', () => {
                // Calculate scroll ratio inside viewport box
                const maxScroll = container.scrollHeight - container.clientHeight;
                if (maxScroll <= 0) return;
                
                const scrollPercent = container.scrollTop / maxScroll;
                
                // Map position mathematically to matching page zones
                let currentPage = Math.ceil(scrollPercent * totalPages);
                if (currentPage === 0) currentPage = 1;
                if (currentPage > totalPages) currentPage = totalPages;

                badge.textContent = `PAGE ${currentPage} / ${totalPages}`;
            });
        }

        // Initialize calculations for both target slide packs
        setupTracker('scroll-pres', 'counter-pres', 14);
        setupTracker('scroll-sched', 'counter-sched', 2);
    </script>

</body>
</html>
