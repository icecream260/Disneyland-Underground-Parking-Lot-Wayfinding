<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disneyland Wayfinding Documentation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft moving liquid silver background */
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f1f5f9);
            background-size: 400% 400%;
            animation: liquidFlow 18s ease infinite;
            background-attachment: fixed;
            padding: 40px 24px;
        }

        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* High-gloss glass container card */
        .light-glass-card {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 28px;
            border-top: 1.5px solid rgba(255, 255, 255, 0.6);
            border-left: 1.5px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 1300px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px -12px rgba(100, 116, 139, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        h1 {
            color: #334155;
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .pdf-stack {
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
            width: 100%;
        }

        .pdf-box {
            width: 100%;
            text-align: left;
        }

        /* Status header layout */
        .pdf-header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(148, 163, 184, 0.05);
        }

        .pdf-title {
            color: #334155;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* Dynamic Counter indicator */
        .pdf-counter-badge {
            background: #007aff;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 980px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.2);
            transition: background 0.3s ease;
        }

        /* Native tracking shell frame */
        .scroll-capture-window {
            width: 100%;
            height: 750px;
            overflow-y: scroll;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            background-color: #ffffff;
        }

        /* Height calibration canvas mapped inside the custom scroll frame */
        .height-simulator-canvas {
            width: 100%;
            position: relative;
            pointer-events: none; /* Allows tracking events to flow through cleanly */
        }

        /* Fixed viewport shield holding the active frame content */
        .sticky-frame-viewport {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 750px;
            pointer-events: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="light-glass-card">
        <h1>Disneyland Underground Parking Lot Wayfinding</h1>

        <div class="pdf-stack">
            <!-- TOP PANEL: Final Presentation -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">Final Presentation</div>
                    <div id="counter-pres" class="pdf-counter-badge">PAGE 1 / 126</div>
                </div>
                <div class="scroll-capture-window" id="window-pres">
                    <!-- Height allocation calibrated to cleanly map 126 pages natively -->
                    <div class="height-simulator-canvas" style="height: 12000px;">
                        <div class="sticky-frame-viewport">
                            <iframe src="DariaEsteeTracie_FinalPresentation.pdf#toolbar=0&navpanes=0&scrollbar=0" loading="eager" oncontextmenu="return false;"></iframe>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BOTTOM PANEL: DISNEY Message Schedule -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">DISNEY Message Schedule</div>
                    <div id="counter-sched" class="pdf-counter-badge">PAGE 1 / 5</div>
                </div>
                <div class="scroll-capture-window" id="window-sched">
                    <!-- Height allocation calibrated for 5 pages natively -->
                    <div class="height-simulator-canvas" style="height: 1500px;">
                        <div class="sticky-frame-viewport">
                            <iframe src="DISNEY_Message%20Schedule.pdf#toolbar=0&navpanes=0&scrollbar=0" loading="lazy" oncontextmenu="return false;"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Active Alignment Track Engine Script -->
    <script>
        function initScrollTracker(windowId, badgeId, totalPages) {
            const scrollWindow = document.getElementById(windowId);
            const badge = document.getElementById(badgeId);

            scrollWindow.addEventListener('scroll', () => {
                const maxScrollablePixels = scrollWindow.scrollHeight - scrollWindow.clientHeight;
                if (maxScrollablePixels <= 0) return;

                // Capture exact position from website container layer
                const scrollRatio = scrollWindow.scrollTop / maxScrollablePixels;
                let calculatedPage = Math.ceil(scrollRatio * totalPages);

                if (calculatedPage <= 0) calculatedPage = 1;
                if (calculatedPage > totalPages) calculatedPage = totalPages;

                badge.textContent = `PAGE ${calculatedPage} / ${totalPages}`;
            });
        }

        // Active layout mapping listeners
        initScrollTracker('window-pres', 'counter-pres', 126);
        initScrollTracker('window-sched', 'counter-sched', 5);
    </script>

</body>
</html>
