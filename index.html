<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disneyland Wayfinding Documentation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft moving liquid silver background */
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f1f5f9);
            background-size: 400% 400%;
            animation: liquidFlow 18s ease infinite;
            background-attachment: fixed;
            padding: 40px 24px;
        }

        @keyframes liquidFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Expanded high-gloss glass card container optimized for vertical reading layout */
        .light-glass-card {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-radius: 28px;
            /* Polished structural highlight edge */
            border-top: 1.5px solid rgba(255, 255, 255, 0.6);
            border-left: 1.5px solid rgba(255, 255, 255, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            max-width: 1300px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px -12px rgba(100, 116, 139, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        h1 {
            color: #334155;
            font-size: 2rem;
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        /* Clean vertical stack setup with generous block padding gaps */
        .pdf-stack {
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
            width: 100%;
        }

        /* Full width structural box container */
        .pdf-box {
            width: 100%;
            text-align: left;
        }

        /* Header wrapper styled to look like an integrated status bar */
        .pdf-header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(148, 163, 184, 0.05);
        }

        .pdf-title {
            color: #334155;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        /* Distinct, clean custom counter indicators */
        .pdf-counter-badge {
            background: rgba(71, 85, 105, 0.1);
            color: #475569;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 980px;
            letter-spacing: 0.5px;
        }

        /* Massive, edge-to-edge structural iframe viewports with strict restriction parameters */
        iframe {
            width: 100%;
            height: 750px;
            border: none;
            border-radius: 16px;
            background-color: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
    </style>
</head>
<body>

    <div class="light-glass-card">
        <h1>Disneyland Underground Parking Lot Wayfinding</h1>

        <div class="pdf-stack">
            <!-- TOP PANEL: Final Presentation -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">Final Presentation</div>
                    <div class="pdf-counter-badge">14 PAGES</div>
                </div>
                <!-- toolbar=0 safely locks out download menus -->
                <iframe src="DariaEsteeTracie_FinalPresentation.pdf#toolbar=0" loading="eager" oncontextmenu="return false;"></iframe>
            </div>

            <!-- BOTTOM PANEL: DISNEY Message Schedule -->
            <div class="pdf-box">
                <div class="pdf-header-wrapper">
                    <div class="pdf-title">DISNEY Message Schedule</div>
                    <div class="pdf-counter-badge">2 PAGES</div>
                </div>
                <iframe src="DISNEY_Message%20Schedule.pdf#toolbar=0" loading="lazy" oncontextmenu="return false;"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
